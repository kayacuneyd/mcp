<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kaya News — Mediastack MCP UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-4xl mx-auto p-4 md:p-6">
    <h1 class="text-2xl font-bold mb-4">Kaya News — Mediastack MCP</h1>

    <!-- Settings Card -->
    <div class="bg-white rounded-xl shadow p-4 mb-4">
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium mb-1">Mode</label>
          <select id="mode" class="w-full border rounded-lg p-2">
            <option value="headlines">Headlines (ülke/dil/kategori)</option>
            <option value="search">Search (anahtar kelime)</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Endpoint (MCP)</label>
          <input id="endpoint" class="w-full border rounded-lg p-2"
                 value="https://kayacuneyt-newsmcp.cuneydkaya.workers.dev/mcp" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Ülke(ler) — countries</label>
          <input id="countries" class="w-full border rounded-lg p-2" placeholder="de veya de,tr" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Dil(ler) — languages</label>
          <select id="languages" class="w-full border rounded-lg p-2">
            <option value="">(hepsi)</option>
            <option value="de">de</option>
            <option value="en">en</option>
            <option value="tr">tr</option>
            <option value="fr">fr</option>
            <option value="es">es</option>
            <option value="it">it</option>
            <option value="ru">ru</option>
            <option value="ar">ar</option>
            <option value="zh">zh</option>
            <option value="nl">nl</option>
            <option value="no">no</option>
            <option value="pt">pt</option>
            <option value="se">se</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Kategori(ler)</label>
          <select id="categories" class="w-full border rounded-lg p-2">
            <option value="">(hepsi)</option>
            <option value="general">general</option>
            <option value="business">business</option>
            <option value="entertainment">entertainment</option>
            <option value="health">health</option>
            <option value="science">science</option>
            <option value="sports">sports</option>
            <option value="technology">technology</option>
          </select>
        </div>

        <div id="qWrap" class="">
          <label class="block text-sm font-medium mb-1">Anahtar kelime (q) — Search modunda</label>
          <input id="q" class="w-full border rounded-lg p-2" placeholder="örn: visa, Stuttgart, Berlin" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Limit</label>
          <input id="limit" type="number" min="1" max="50" value="10"
                 class="w-full border rounded-lg p-2" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Offset (sayfalama)</label>
          <input id="offset" type="number" min="0" value="0"
                 class="w-full border rounded-lg p-2" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Tarih (başlangıç)</label>
          <input id="dateFrom" type="date" class="w-full border rounded-lg p-2" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">Tarih (bitiş)</label>
          <input id="dateTo" type="date" class="w-full border rounded-lg p-2" />
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Özet dili (summary language)</label>
          <select id="sumLang" class="w-full border rounded-lg p-2">
            <option value="tr" selected>Türkçe</option>
            <option value="de">Deutsch</option>
            <option value="en">English</option>
          </select>
        </div>

        <div class="flex items-center gap-2 mt-6">
          <input id="autoSummary" type="checkbox" class="h-4 w-4" checked />
          <label for="autoSummary" class="text-sm">Özetleri otomatik getir</label>
        </div>
      </div>

      <div class="mt-4 flex items-center gap-2">
        <button id="runBtn"
                class="bg-black text-white rounded-lg px-4 py-2 hover:bg-gray-800">
          Getir
        </button>
        <button id="shareBtn"
                class="border rounded-lg px-4 py-2 hover:bg-gray-100">
          Link’i Kopyala
        </button>
        <span id="status" class="text-sm text-gray-500 ml-2"></span>
      </div>
    </div>

    <!-- Results -->
    <div class="bg-white rounded-xl shadow p-4">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-semibold">Sonuçlar</h2>
        <div class="flex gap-2">
          <button id="prevBtn" class="border rounded-lg px-3 py-1">Prev</button>
          <button id="nextBtn" class="border rounded-lg px-3 py-1">Next</button>
        </div>
      </div>
      <ul id="list" class="space-y-3"></ul>
    </div>
  </div>

  <script>
    const els = {
      mode: document.getElementById('mode'),
      endpoint: document.getElementById('endpoint'),
      countries: document.getElementById('countries'),
      languages: document.getElementById('languages'),
      categories: document.getElementById('categories'),
      q: document.getElementById('q'),
      qWrap: document.getElementById('qWrap'),
      limit: document.getElementById('limit'),
      offset: document.getElementById('offset'),
      runBtn: document.getElementById('runBtn'),
      shareBtn: document.getElementById('shareBtn'),
      status: document.getElementById('status'),
      list: document.getElementById('list'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn')
      , sumLang: document.getElementById('sumLang')
      , autoSummary: document.getElementById('autoSummary')
      , dateFrom: document.getElementById('dateFrom')
      , dateTo: document.getElementById('dateTo')
    };

    // URL param -> form state
    function loadFromQuery() {
      const p = new URLSearchParams(location.search);
      const get = (k, d='') => p.get(k) ?? d;
      els.mode.value = get('mode','headlines');
      els.endpoint.value = get('endpoint', els.endpoint.value);
      els.countries.value = get('countries','');
      els.languages.value = get('languages','');
      els.categories.value = get('categories','');
      els.q.value = get('q','');
      els.limit.value = get('limit','10');
      els.offset.value = get('offset','0');
      els.sumLang.value = get('sumLang','tr');
      els.autoSummary.checked = get('autoSummary','1') !== '0';
      els.dateFrom.value = get('dateFrom','');
      els.dateTo.value = get('dateTo','');
      toggleQ();
    }

    function toggleQ() {
      els.qWrap.style.opacity = (els.mode.value === 'search') ? '1' : '0.5';
    }

    function toArgs() {
      const args = {};
      const v = (el) => el.value.trim();
      if (v(els.countries)) args.countries = v(els.countries);
      if (v(els.languages)) args.languages = v(els.languages);
      if (v(els.categories)) args.categories = v(els.categories);
      if (els.mode.value === 'search' && v(els.q)) args.q = v(els.q);
      const L = parseInt(els.limit.value, 10);
      const O = parseInt(els.offset.value, 10);
      if (!isNaN(L)) args.limit = L;
      if (!isNaN(O)) args.offset = O;
      if (els.dateFrom.value || els.dateTo.value) {
        const from = els.dateFrom.value || '';
        const to = els.dateTo.value || '';
        const date = (from && to) ? `${from},${to}` : (from || to);
        if (date) args.date = date; // Worker tarafında opsiyonel destek
      }
      return args;
    }

    function toQuery() {
      const p = new URLSearchParams();
      p.set('mode', els.mode.value);
      p.set('endpoint', els.endpoint.value);
      if (els.countries.value) p.set('countries', els.countries.value);
      if (els.languages.value) p.set('languages', els.languages.value);
      if (els.categories.value) p.set('categories', els.categories.value);
      if (els.mode.value === 'search' && els.q.value) p.set('q', els.q.value);
      p.set('limit', els.limit.value);
      p.set('offset', els.offset.value);
      p.set('sumLang', els.sumLang.value);
      p.set('autoSummary', els.autoSummary.checked ? '1' : '0');
      if (els.dateFrom.value) p.set('dateFrom', els.dateFrom.value);
      if (els.dateTo.value) p.set('dateTo', els.dateTo.value);
      return p.toString();
    }

    const MAX_SUM_CONCURRENCY = 3;
    let inflight = 0;
    const queue = [];

    function scheduleSummary(li, url, priority=false) {
      if (li.dataset.scheduled === '1') return; // prevent double
      li.dataset.scheduled = '1';
      if (priority) queue.unshift({ li, url }); else queue.push({ li, url });
      processQueue();
    }

    async function processQueue() {
      while (inflight < MAX_SUM_CONCURRENCY && queue.length) {
        const job = queue.shift();
        inflight++;
        summarizeInto(job.li, job.url)
          .finally(() => {
            inflight--;
            processQueue();
          });
      }
    }

    async function summarizeInto(containerEl, url) {
      const lang = els.sumLang.value || 'tr';
      let holder = containerEl.querySelector('.summary');
      if (!holder) {
        holder = document.createElement('div');
        holder.className = 'summary mt-2 text-sm text-gray-800 bg-gray-50 border rounded p-2';
        containerEl.appendChild(holder);
      }
      holder.textContent = 'Özet alınıyor…';
      try {
        // basic retry with backoff (up to 2 retries)
        const call = async (attempt=0) => {
          const res = await fetch(els.endpoint.value, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ tool: 'summarize_url', args: { url, lang, max_tokens: 180 } })
          });
          if (!res.ok && (res.status === 429 || res.status >= 500) && attempt < 2) {
            await new Promise(r => setTimeout(r, (attempt+1)*800));
            return call(attempt+1);
          }
          const js = await res.json().catch(()=>({}));
          return { ok: res.ok, js, status: res.status };
        };
        const { ok, js, status } = await call(0);
        if (!ok) {
          holder.textContent = js && js.error ? `Özet hatası: ${js.error}` : `Özet hatası (HTTP ${status})`;
          holder.classList.add('text-red-600');
          return;
        }
        const summary = js.summary || '(özet bulunamadı)';
        holder.textContent = summary;
        // actions
        const actions = containerEl.querySelector('.actions');
        if (actions) {
          actions.classList.remove('hidden');
          const copyBtn = actions.querySelector('.copy');
          const shareBtn = actions.querySelector('.share');
          const tweetA = actions.querySelector('.tweet');
          copyBtn.onclick = async () => {
            try { await navigator.clipboard.writeText(summary); els.status.textContent = 'Summary copied'; }
            catch { els.status.textContent = 'Copy failed'; }
          };
          shareBtn.onclick = async () => {
            const shareData = { title: 'Haber Özeti', text: summary, url };
            if (navigator.share) {
              try { await navigator.share(shareData); } catch {}
            } else {
              try { await navigator.clipboard.writeText(`${summary}\n${url}`); els.status.textContent = 'Copied for share'; } catch {}
            }
          };
          const tweetText = encodeURIComponent(summary.length > 260 ? summary.slice(0,257)+"…" : summary);
          tweetA.href = `https://twitter.com/intent/tweet?text=${tweetText}&url=${encodeURIComponent(url)}&via=baltikpostasi`;
        }
      } catch (e) {
        holder.textContent = 'Özet alma sırasında hata';
        holder.classList.add('text-red-600');
      }
    }

    async function run() {
      els.status.textContent = 'Fetching...';
      els.list.innerHTML = '';

      // Reset scheduling state
      inflight = 0; queue.length = 0;
      const io = new IntersectionObserver((entries) => {
        for (const e of entries) {
          if (e.isIntersecting) {
            const li = e.target;
            const url = li.dataset.url;
            if (els.autoSummary.checked && url && url !== '#') {
              scheduleSummary(li, url, true); // visible first
              io.unobserve(li);
            }
          }
        }
      }, { root: null, rootMargin: '0px', threshold: 0.2 });

      const tool = (els.mode.value === 'search') ? 'search_news' : 'get_top_headlines';
      const body = { tool, args: toArgs() };

      try {
        const res = await fetch(els.endpoint.value, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body)
        });
        const json = await res.json();
        els.status.textContent = res.ok ? 'OK' : `Error ${res.status}`;
        const articles = json.articles || json.data || [];
        if (!Array.isArray(articles) || articles.length === 0) {
          els.list.innerHTML = '<li class="text-sm text-gray-500">Sonuç yok.</li>';
          return;
        }
        for (const a of articles) {
          const li = document.createElement('li');
          li.className = 'border rounded-lg p-3';
          const title = a.title || '(başlık yok)';
          const url = a.url || '#';
          li.dataset.url = url;
          const src = a.source ? ` · ${a.source}` : '';
          const ts = a.published_at ? ` · ${new Date(a.published_at).toLocaleString()}` : '';
          li.innerHTML = `
            <a href="${url}" target="_blank" class="font-medium hover:underline">${title}</a>
            <div class="text-sm text-gray-600">${(a.country||'').toUpperCase()}${src}${ts}</div>
            <div class="mt-2 hidden actions gap-2">
              <button class="copy border rounded px-2 py-1 text-xs">Copy summary</button>
              <button class="share border rounded px-2 py-1 text-xs">Share</button>
              <a class="tweet border rounded px-2 py-1 text-xs" target="_blank">Tweet</a>
            </div>
          `;
          els.list.appendChild(li);

          // If autoSummary disabled, still observe for potential manual trigger later
          if (els.autoSummary.checked) {
            // schedule lazily by visibility
            io.observe(li);
            // fallback: schedule soon in case IntersectionObserver doesn't fire
            setTimeout(() => scheduleSummary(li, url, false), 0);
          }
        }
      } catch (e) {
        els.status.textContent = 'Fetch error';
        els.list.innerHTML = `<li class="text-sm text-red-600">Hata: ${e}</li>`;
      }

      // URL'yi güncelle
      const qs = toQuery();
      const newUrl = location.pathname + '?' + qs;
      history.replaceState(null, '', newUrl);

      // io.disconnect(); (removed as per instructions)
    }

    function nextPage() {
      const o = parseInt(els.offset.value || '0', 10);
      const l = parseInt(els.limit.value || '10', 10);
      els.offset.value = String(Math.max(0, o + l));
      run();
    }
    function prevPage() {
      const o = parseInt(els.offset.value || '0', 10);
      const l = parseInt(els.limit.value || '10', 10);
      els.offset.value = String(Math.max(0, o - l));
      run();
    }

    // Events
    els.mode.addEventListener('change', () => { toggleQ(); run(); });
    els.runBtn.addEventListener('click', run);
    els.prevBtn.addEventListener('click', prevPage);
    els.nextBtn.addEventListener('click', nextPage);
    els.shareBtn.addEventListener('click', async () => {
      const qs = toQuery();
      const link = location.origin + location.pathname + '?' + qs;
      try {
        await navigator.clipboard.writeText(link);
        els.status.textContent = 'Link kopyalandı';
      } catch {
        els.status.textContent = link;
      }
    });
    els.sumLang.addEventListener('change', () => { if (els.list.children.length) run(); });
    els.autoSummary.addEventListener('change', () => { if (els.list.children.length) run(); });
    els.languages.addEventListener('change', () => run());
    els.categories.addEventListener('change', () => run());
    els.dateFrom.addEventListener('change', () => run());
    els.dateTo.addEventListener('change', () => run());

    // Init
    loadFromQuery();
    // İlk yüklemede otomatik sorgu (isteğe bağlı)
    if (location.search) run();
  </script>
</body>
</html>
